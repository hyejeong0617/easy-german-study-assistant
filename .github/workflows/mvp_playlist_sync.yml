name: Easy German MVP - Sync Playlist

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch A2 playlist and sync first 6 videos to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: 6878c89b-220b-4dc4-96a1-ae021d37a2b3
          A2_PLAYLIST_URL: https://www.youtube.com/playlist?list=PLk1fjOl39-5201BUdhtOM_x23poNvLouT
        run: python run_mvp_sync.py
