name: Legacy Daily Lesson - Manual Only

on:
  workflow_dispatch:
    inputs:
      study_date:
        description: "Legacy test only: Study date in YYYY-MM-DD format"
        required: true
        default: "2026-09-29"

jobs:
  legacy-lesson:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube cookies if available
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
            echo "YOUTUBE_COOKIES_FILE=$GITHUB_WORKSPACE/youtube_cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Run legacy date-based pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: 6878c89b-220b-4dc4-96a1-ae021d37a2b3
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python run_daily_lesson.py --study-date "${{ github.event.inputs.study_date }}"

      - name: Delete temporary YouTube cookies
        if: ${{ always() }}
        run: rm -f youtube_cookies.txt
